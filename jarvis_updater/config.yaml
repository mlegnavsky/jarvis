name: Jarvis Updater
version: "1.0.0"
slug: jarvis_updater
description: Stable OAuth gateway and independent verified Jarvis recovery
url: https://github.com/mlegnavsky/jarvis
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
hassio_api: true
hassio_role: manager
options:
  api_token: ""
  jarvis_api_token: ""
  updates_enabled: false
  auto_pairing: false
  gateway_enabled: true
  revoke_generation: 0
schema:
  api_token: password
  jarvis_api_token: password
  updates_enabled: bool
  auto_pairing: bool
  gateway_enabled: bool
  revoke_generation: int(0,)


ports:
  8100/tcp: null
ports_description:
  8100/tcp: Stable Jarvis gateway (automatically activated on port 8099)
