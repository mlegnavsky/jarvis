name: Jarvis
version: "3.12.0"
slug: jarvis
description: Current home inventory and authenticated controlled actions. Experimental.
url: https://github.com/mlegnavsky/jarvis
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant: "2026.6.0"
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: local_apps
    read_only: false
    path: /addons
  - type: share
    read_only: false
    path: /share
  - type: media
    read_only: false
    path: /media
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Authenticated Jarvis API (route through Cloudflare Tunnel; never forward router ports)
options:
  api_token: ""
  mcp_enabled: false
  oauth_public_url: ""
  oauth_client_secret: ""
  oauth_owner_secret: ""
  oauth_redirect_uris: []
  writes_enabled: false
  maintenance_enabled: false
  maintenance_token: ""
  firmware_targets: []
  allowed_entities: []
  allowed_services: []
schema:
  api_token: password
  mcp_enabled: bool
  oauth_public_url: str
  oauth_client_secret: password
  oauth_owner_secret: password
  oauth_redirect_uris:
    - str
  writes_enabled: bool
  maintenance_enabled: bool
  maintenance_token: password
  firmware_targets:
    - str
  allowed_entities:
    - str
  allowed_services:
    - str

